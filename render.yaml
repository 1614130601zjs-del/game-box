services:
  - type: web
    name: sese-board-game-mcp
    runtime: python
    plan: free
    region: singapore
    buildCommand: python3 -m compileall -q games/sese-board-game/sese_board_game
    startCommand: cd games/sese-board-game && python3 -m sese_board_game.mcp_http_server
    healthCheckPath: /healthz
    autoDeployTrigger: off
